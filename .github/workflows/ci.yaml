name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devbox
        uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0

      - name: Format Rust code
        run: devbox run -- cargo fmt --all -- --check

      - name: Lint Rust code
        run: devbox run -- cargo clippy --workspace -- -D warnings

      - name: Run Rust tests
        run: devbox run -- cargo test --workspace --all-features

      - name: Check Rust dependencies for security vulnerabilities
        run: devbox run -- cargo deny check bans licenses sources
